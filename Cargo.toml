[package]
name = "sesh-ssh"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A fast, minimal SSH connection manager for VPS hosts"
repository = "https://github.com/roushou/sesh"

[[bin]]
name = "sesh"
path = "src/main.rs"

[dependencies]
eyre = "0.6"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
